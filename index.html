<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request (bản dễ dùng)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Token từ Seva Design System (cùng bộ với prototype WorkPlace) */
  :root{
    --primary-500:#24544b; --primary-600:#1b443c; --primary-700:#153630; --primary-50:#eaf2f0;
    --canvas:#fafafa; --surface:#fff; --subtle:#f2f2f2;
    --n-300:#e4e6e6; --n-400:#dbdcdc; --n-600:#9b9c9c; --n-700:#737676; --n-800:#4c4d4d; --n-900:#262727;
    --link:#175cd3; --err-bg:#fffbfa; --err-bd:#fda29b; --err-tx:#912018; --warn-bg:#fffcf5; --warn-bd:#fec84b; --warn-tx:#7a2e0e;
    --ok-bg:#f8fef9; --ok-bd:#6ce9a6; --ok-tx:#05603a; --info-bg:#f5faff; --info-bd:#84caff; --info-tx:#1849a9; --destructive:#d92d20;
    --r-2xs:4px; --r-xs:6px; --r-sm:8px; --r-md:12px; --r-full:999px;
    /* tên cũ dùng trong JS */
    --green:var(--primary-500); --btn:var(--primary-500); --btn-h:var(--primary-600); --blue:var(--primary-500); --red:var(--destructive);
    --muted:var(--n-700); --muted2:var(--n-800); --line:var(--n-300); --line2:var(--n-400); --card:#fff; --page:var(--canvas); --text:var(--n-900); --chip:var(--info-tx);
  }
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:20px;color:var(--n-900);background:var(--canvas);-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;} a{color:var(--link);cursor:pointer;text-decoration:none;}
  :focus-visible{outline:2px solid #8dbbb6;outline-offset:2px;}
  svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle;}
  .app{display:flex;flex-direction:row;height:100vh;min-width:960px;}
  .body{display:flex;flex:1;min-height:0;}
  /* header */
  .hdr{height:56px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--n-300);display:flex;align-items:center;gap:8px;padding:8px 16px;}
  .brand{display:flex;align-items:center;gap:10px;margin-right:16px;} .logo{width:32px;height:32px;border-radius:8px;background:var(--primary-500);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;} .brand b{font-size:16px;font-weight:600;}
  .hn{border:none;background:none;height:36px;padding:0 12px;border-radius:var(--r-xs);color:var(--n-800);cursor:pointer;} .hn:hover{background:var(--subtle);} .hn.on{background:var(--primary-50);color:var(--primary-500);font-weight:500;}
  .grow{flex:1;} .icon-btn{width:36px;height:36px;border:none;background:none;border-radius:var(--r-xs);color:var(--n-800);display:flex;align-items:center;justify-content:center;cursor:pointer;} .icon-btn:hover{background:var(--subtle);}
  .hu{display:flex;gap:10px;align-items:center;margin-left:8px;} .hu b{display:block;font-size:13px;line-height:16px;font-weight:500;} .hu span{display:block;font-size:12px;color:var(--n-700);}
  .av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;}
  .av.sm{width:24px;height:24px;font-size:10px;} .av.xs{width:20px;height:20px;font-size:8px;border:2px solid #fff;margin-left:-6px;} .av.xs:first-child{margin-left:0;}
  /* sidebar (xanh Seva) */
  .side{width:250px;background:var(--primary-500);color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:16px 8px;font-size:14px;}
  .s-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:var(--r-xs);padding:0 10px;height:36px;margin-bottom:12px;color:rgba(255,255,255,.7);} .s-search input{border:none;outline:none;background:none;flex:1;min-width:0;color:#fff;} .s-search input::placeholder{color:rgba(255,255,255,.65);}
  .back{display:flex;align-items:center;gap:6px;padding:8px 10px;margin-bottom:8px;color:rgba(255,255,255,.85);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.14);}
  .nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-xs);color:rgba(255,255,255,.88);cursor:pointer;} .nv:hover{background:rgba(255,255,255,.08);} .nv.on{background:rgba(255,255,255,.14);color:#fff;font-weight:500;}
  .sec-h{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.6);font-size:12px;font-weight:600;letter-spacing:.4px;margin:16px 0 4px;padding:0 10px;text-transform:uppercase;}
  .gl{display:flex;align-items:center;gap:8px;padding:7px 10px;color:rgba(255,255,255,.85);cursor:pointer;border-radius:var(--r-xs);font-size:13px;} .gl:hover{background:rgba(255,255,255,.08);} .gl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .star{color:var(--n-600);cursor:pointer;display:inline-flex;} .star.on{color:#fec84b;} .side .star{color:rgba(255,255,255,.5);} .side .star.on{color:#fec84b;}
  .rq .star,.gt .star{color:var(--n-600);} .rq .star.on,.gt .star.on{color:#f79009;}
  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);overflow:hidden;}
  .mhead{padding:16px 24px 0;background:#fff;border-bottom:1px solid var(--n-300);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between;}
  .mhead h1{font-size:20px;line-height:28px;font-weight:600;margin:0 0 8px;width:100%;} .mhead .row{display:flex;justify-content:space-between;align-items:flex-end;width:100%;gap:12px;flex-wrap:wrap;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;} .tab{padding:10px 12px 11px;font-size:14px;color:var(--n-700);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px;} .tab.on{color:var(--primary-500);font-weight:500;border-bottom-color:var(--primary-500);} .tab:hover{color:var(--n-900);}
  .tools{display:flex;gap:8px;align-items:center;padding-bottom:8px;}
  .inp{border:1px solid var(--n-400);border-radius:var(--r-xs);padding:0 10px;height:32px;background:#fff;min-width:0;color:var(--n-900);} textarea.inp{height:auto;padding:8px 10px;} .inp:focus{outline:none;border-color:var(--primary-500);box-shadow:0 0 0 2px var(--primary-50);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-xs);border:1px solid var(--n-400);background:#fff;color:var(--n-800);cursor:pointer;white-space:nowrap;} .btn:hover{background:var(--subtle);}
  .btn.blue,.btn.green{background:var(--primary-500);border-color:var(--primary-500);color:#fff;font-weight:500;} .btn.blue:hover,.btn.green:hover{background:var(--primary-600);}
  .btn.gray{background:#fff;color:var(--n-800);} .btn.red{background:var(--destructive);border-color:var(--destructive);color:#fff;font-weight:500;} .btn.teal{background:var(--primary-50);border-color:var(--primary-50);color:var(--primary-500);font-weight:500;}
  .scroll{flex:1;overflow:auto;} .scroll.gray{background:var(--canvas);padding:16px 24px;}
  /* danh sách đề xuất */
  .scroll:not(.gray){padding:16px 24px;} .scroll:not(.gray)>.rq:first-child{border-radius:var(--r-sm) var(--r-sm) 0 0;border-top:1px solid var(--n-300);} .rq{border-left:1px solid var(--n-300);border-right:1px solid var(--n-300);}
  .rq{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--n-300);cursor:pointer;background:#fff;} .rq:hover{background:var(--canvas);} .rq.unread .tt{font-weight:600;}
  .rq .mid{flex:1;min-width:0;} .rq .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .rq .sub{color:var(--n-700);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .rq .sub b{font-weight:500;color:var(--n-800);}
  .chip{display:inline-block;font-size:13px;padding:3px 8px;border-radius:var(--r-xs);border:1px solid var(--info-bd);background:var(--info-bg);color:var(--info-tx);white-space:nowrap;} .chip.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx);} .chip.r{background:var(--err-bg);border-color:var(--err-bd);color:var(--err-tx);} .chip.w{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-tx);} .chip.y{background:var(--subtle);border-color:var(--subtle);color:var(--n-800);}
  .who{display:flex;align-items:center;gap:8px;width:160px;font-size:13px;color:var(--n-800);flex-shrink:0;} .appr{width:90px;display:flex;flex-shrink:0;} .dt{width:80px;font-size:13px;color:var(--n-700);text-align:right;flex-shrink:0;} .dot{width:8px;height:8px;border-radius:50%;background:var(--destructive);flex-shrink:0;}
  .pager{text-align:center;padding:14px;color:var(--n-700);font-size:13px;} .empty{padding:60px 20px;text-align:center;color:var(--n-700);}
  /* quản lý nhóm */
  .selall{background:#fff;border:1px solid var(--n-300);margin:0 0 12px;padding:10px 16px;border-radius:var(--r-sm);display:flex;align-items:center;gap:10px;}
  .fold{background:#fff;border:1px solid var(--n-300);margin:0 0 16px;border-radius:var(--r-sm);overflow:hidden;} .fold-h{padding:12px 16px;display:flex;gap:8px;} .fold-h b{display:block;font-weight:600;} .fold-h span.c{color:var(--n-700);font-size:13px;}
  table.gt{width:100%;border-collapse:collapse;} table.gt th{background:var(--subtle);color:var(--n-800);font-size:13px;font-weight:500;text-align:left;padding:10px 8px;border-top:1px solid var(--n-300);border-bottom:1px solid var(--n-300);}
  table.gt td{padding:12px 8px;border-bottom:1px solid var(--n-300);vertical-align:middle;} table.gt tr:last-child td{border-bottom:none;} table.gt tr:hover td{background:var(--canvas);}
  .gname{font-weight:500;} .gdesc{color:var(--n-700);font-size:13px;max-width:760px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sw{position:relative;width:36px;height:20px;border-radius:var(--r-full);background:var(--n-600);border:none;cursor:pointer;padding:0;display:inline-block;transition:background .15s;} .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;} .sw.on{background:var(--primary-500);} .sw.on::after{transform:translateX(16px);left:2px;}
  /* studio / wizard */
  .stu{display:flex;flex:1;min-height:0;} .snav{width:240px;background:#fff;border-right:1px solid var(--n-300);overflow:auto;flex-shrink:0;padding:8px;}
  .sn{display:flex;gap:12px;padding:10px;border-radius:var(--r-xs);cursor:pointer;color:var(--n-700);margin-bottom:2px;} .sn:hover{background:var(--canvas);} .sn b{display:block;font-weight:500;color:var(--n-900);} .sn span.s{display:block;font-size:12px;color:var(--n-700);line-height:16px;margin-top:2px;}
  .sn.on{background:var(--primary-50);} .sn.on b,.sn.on svg{color:var(--primary-500);}
  .sbody{flex:1;overflow:auto;padding:24px 0;} .sbody.gray{padding:24px 0;background:var(--canvas);} .col{width:800px;max-width:calc(100% - 48px);margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .card{background:#fff;border:1px solid var(--n-300);border-radius:var(--r-sm);box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .ch{display:flex;gap:12px;padding:16px 20px;align-items:flex-start;} .ch .ic{color:var(--primary-500);margin-top:2px;} .ch .ct{flex:1;} .ch h3{margin:0;font-size:16px;line-height:24px;font-weight:600;} .ch p{margin:2px 0 0;color:var(--n-700);font-size:13px;}
  .ch .act{color:var(--primary-500);font-size:13px;font-weight:500;cursor:pointer;display:flex;gap:8px;align-items:center;} .ch .act .sep{color:var(--n-400);font-weight:400;}
  .kv{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--n-300);} .kv .v{color:var(--n-700);display:flex;gap:8px;align-items:center;}
  .set{display:grid;grid-template-columns:1fr 385px;gap:32px;align-items:center;padding:12px 20px;border-top:1px solid var(--n-300);} .set .k small{display:block;color:var(--n-700);font-size:13px;margin-top:1px;}
  .sel{width:100%;border:1px solid var(--n-400);border-radius:var(--r-xs);height:32px;padding:0 8px;background:#fff;color:var(--n-900);} .cks label{display:flex;align-items:center;gap:8px;padding:3px 0;}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary-500);cursor:pointer;margin:0;}
  .ap{display:flex;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid var(--n-300);} .ap .m{font-size:13px;color:var(--n-700);} .ap code{color:var(--primary-500);font-size:12px;}
  .menu{position:absolute;background:#fff;border:1px solid var(--n-300);box-shadow:0 8px 24px rgba(0,0,0,.14);border-radius:var(--r-sm);padding:4px;z-index:50;min-width:200px;} .menu div{padding:8px 12px;cursor:pointer;color:var(--n-800);border-radius:var(--r-2xs);} .menu div:hover{background:var(--primary-50);color:var(--primary-500);}
  .fld{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--n-300);} .fld .nm{flex:1;} .fld .tg{font-size:11px;color:var(--n-600);font-weight:600;} .fld .tg.req{color:var(--err-tx);} .fld .ty{background:var(--subtle);color:var(--n-800);font-size:12px;padding:2px 10px;border-radius:var(--r-xs);}
  .emptyc{padding:28px;text-align:center;color:var(--n-700);border-top:1px solid var(--n-300);} .emptyc svg{width:32px;height:32px;display:block;margin:0 auto 6px;color:var(--n-600);}
  .sn .n{width:24px;height:24px;border-radius:50%;background:var(--n-400);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}
  .wfoot{display:flex;justify-content:space-between;padding:12px 24px;border-top:1px solid var(--n-300);background:#fff;} .pv{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 20px 16px;} .pv .b{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info-tx);border-radius:var(--r-xs);padding:6px 10px;font-weight:500;} .pv .ar{color:var(--n-600);}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(10,10,10,.32);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:70px 0 40px;} .scrim.show{display:flex;}
  .modal{background:#fff;width:520px;border-radius:var(--r-md);box-shadow:0 12px 32px rgba(0,0,0,.2);overflow:hidden;} .modal.wide{width:680px;} .modal.sm{width:440px;}
  .mh{padding:16px 20px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--n-300);} .mh .x{cursor:pointer;font-size:20px;color:var(--n-700);line-height:1;}
  .mb{padding:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 230px);overflow:auto;} .mf{display:flex;gap:12px;padding:12px 20px 20px;} .mf .btn{flex:1;height:36px;}
  .fr{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;} .fr.v{grid-template-columns:1fr;} .fr label{font-weight:500;} .fr label small{display:block;font-weight:400;color:var(--n-700);font-size:12px;margin-top:2px;} .fr .inp,.fr .sel{width:100%;}
  .adv{text-align:center;color:var(--primary-500);font-size:12px;font-weight:600;cursor:pointer;padding:6px 0;border-bottom:1px dashed var(--n-400);}
  .gbox{background:var(--canvas);border:1px solid var(--n-300);padding:12px;border-radius:var(--r-sm);display:flex;flex-direction:column;gap:8px;} .gbox .hh{color:var(--primary-500);font-size:12px;font-weight:600;}
  .rt{border:1px solid var(--n-400);border-radius:var(--r-xs);} .rt .tb{display:flex;gap:12px;padding:6px 10px;border-bottom:1px solid var(--n-300);color:var(--n-700);} .rt .ed{min-height:90px;padding:8px 10px;outline:none;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--n-900);color:#fff;padding:10px 16px;border-radius:var(--r-xs);z-index:300;font-size:13px;}
  /* chi tiết đề xuất */
  .dw{display:flex;flex:1;min-height:0;} .dl{flex:1;overflow:auto;padding:24px;} .dr{width:320px;background:var(--canvas);border-left:1px solid var(--n-300);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .dl h1{font-size:20px;line-height:28px;margin:0 0 4px;font-weight:600;} .dl .st{color:var(--n-700);font-size:13px;margin-bottom:16px;} .dl .st b{color:var(--info-tx);font-weight:500;}
  .abar{display:flex;gap:12px;padding:12px;margin-bottom:16px;background:#fff;border:1px solid var(--n-300);border-radius:var(--r-sm);} .abar .btn{flex:1;height:36px;}
  .dl h4{font-size:12px;letter-spacing:.4px;margin:20px 0 8px;text-transform:uppercase;display:flex;justify-content:space-between;border-bottom:1px solid var(--n-300);padding-bottom:8px;color:var(--n-800);} .dl h4 span{color:var(--primary-500);text-transform:none;letter-spacing:0;}
  .ir{display:grid;grid-template-columns:160px 1fr;padding:8px 0;} .ir .k{color:var(--n-700);} .ir .n{color:var(--n-600);margin-right:8px;}
  .rc{background:#fff;border:1px solid var(--n-300);border-radius:var(--r-sm);padding:12px 16px;} .rc h5{margin:0 0 8px;color:var(--n-800);font-size:12px;letter-spacing:.4px;text-transform:uppercase;font-weight:600;}
  .prog{background:var(--primary-50);border-radius:var(--r-xs);padding:10px;display:flex;justify-content:space-between;color:var(--primary-500);font-weight:500;margin-bottom:8px;}
  .lg{display:flex;gap:10px;margin:8px 0;font-size:13px;} .lg .d{width:20px;height:20px;border-radius:50%;background:var(--primary-500);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .note{color:var(--n-700);font-size:12px;margin:4px 0;} .tag-n{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);font-size:11px;padding:1px 6px;border-radius:var(--r-xs);margin-left:6px;font-weight:400;}
.tbw{background:#fff;border:1px solid var(--n-300);border-radius:var(--r-sm);overflow:auto;}
  table.tb,table.gt{width:100%;border-collapse:separate;border-spacing:0;}
  table.tb th,table.gt th{background:var(--subtle);color:var(--n-900);font-size:14px;font-weight:500;text-align:left;padding:0 16px;height:44px;border-top:none;border-bottom:1px solid var(--n-300);border-right:1px solid var(--n-300);position:sticky;top:0;z-index:2;}
  table.tb td,table.gt td{padding:8px 16px;height:60px;border-bottom:1px solid var(--n-300);border-right:1px solid var(--n-300);vertical-align:middle;}
  table.tb th:last-child,table.tb td:last-child,table.gt th:last-child,table.gt td:last-child{border-right:none;} table.tb tr:last-child td,table.gt tr:last-child td{border-bottom:none;}
  table.tb th.c,table.tb td.c{text-align:center;padding:0;} tr.rr{cursor:pointer;} tr.rr:hover td{background:var(--canvas);} tr.rr.unread .t{font-weight:600;}
  .stack{display:flex;flex-direction:column;min-width:0;line-height:1.4;} .stack .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .stack .s{font-size:13px;color:var(--n-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .stack .dot{display:inline-block;margin-right:2px;}
  .pp{display:inline-flex;gap:8px;align-items:center;} .fold table.gt th:first-child,.fold table.gt td:first-child{padding-left:16px;}
.rcard{background:#fff;border:1px solid var(--n-300);border-radius:var(--r-sm);padding:14px 16px 12px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);} .rcard:hover{border-color:#8dbbb6;box-shadow:0 2px 8px rgba(0,0,0,.08);} .rcard.unread{border-left:3px solid var(--primary-500);}

/* ===== SEVA VISUAL REDESIGN v2 ===== */
/* =================================================================
   SEVA WORKSPACE — VISUAL REDESIGN v2
   Thiết kế khác biệt hoàn toàn với base.vn
   CHỈ override visual (colors, shadows, borders, typography)
   KHÔNG thay đổi bất kỳ flow/logic/layout nào
   =================================================================

   DESIGN PHILOSOPHY:
   - base.vn = flat green enterprise, boxy, dense
   - Seva Workspace = warm, airy, luminous, premium feel
   
   KEY DIFFERENCES FROM BASE.VN:
   1. Header: Gradient accent line + frosted glass effect (vs flat white)
   2. Rail: Deep charcoal with glowing active state (vs base.vn's dark sidebar)
   3. Sidebar: Warm off-white with soft depth (vs base.vn's green sidebar)
   4. Cards: Rounded 16px, soft shadows, subtle border (vs base.vn's sharp boxes)
   5. Status: Rounded pills with icons (vs base.vn's flat colored chips)
   6. Typography: Larger, more breathing room, warmer colors
   7. CTA: Vibrant gradient coral → rose (vs base.vn's flat green/blue buttons)
   8. Tables: Zebra striping, row hover lift (vs base.vn's dense bordered rows)
   ================================================================= */

/* ===== NEW TOKEN SYSTEM ===== */
:root {
  /* Brand: Deep indigo-teal, distinct from base.vn's flat green */
  --sv-brand: #24544b;
  --sv-brand-dark: #1b443c;
  --sv-brand-light: #eaf2f0;
  --sv-brand-50: #f4f8f7;
  
  /* Accent: Warm coral/rose gradient feel */
  --sv-accent: #f43f5e;
  --sv-accent-dark: #e11d48;
  --sv-accent-glow: rgba(244, 63, 94, 0.15);
  
  /* Neutrals: Warmer, not as cold as base.vn */
  --sv-bg: #f8fafb;
  --sv-surface: #ffffff;
  --sv-surface-warm: #fafbfc;
  --sv-border: #e8ebed;
  --sv-border-light: #f0f2f4;
  --sv-text: #1a1d21;
  --sv-text-secondary: #5f6468;
  --sv-text-muted: #8b9097;
  
  /* Functional */
  --sv-success: #059669;
  --sv-success-bg: #ecfdf5;
  --sv-warning: #d97706;
  --sv-warning-bg: #fffbeb;
  --sv-error: #dc2626;
  --sv-error-bg: #fef2f2;
  --sv-info: #2563eb;
  --sv-info-bg: #eff6ff;
  
  /* Shadows */
  --sv-shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --sv-shadow-sm: 0 2px 6px rgba(0,0,0,0.06);
  --sv-shadow-md: 0 4px 14px rgba(0,0,0,0.08);
  --sv-shadow-lg: 0 8px 28px rgba(0,0,0,0.12);
  --sv-shadow-lift: 0 4px 16px rgba(0,0,0,0.1), 0 1px 3px rgba(0,0,0,0.05);
  
  /* Radii: More rounded than base.vn */
  --sv-r-sm: 10px;
  --sv-r-md: 14px;
  --sv-r-lg: 18px;
  --sv-r-xl: 24px;
  --sv-r-full: 999px;
  
  /* Transitions */
  --sv-ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ===== GLOBAL TYPOGRAPHY ===== */
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif !important;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: var(--sv-bg) !important;
  color: var(--sv-text) !important;
}

/* ===== GLOBAL HEADER — Frosted glass with gradient accent ===== */
.global-header {
  background: rgba(255,255,255,0.85) !important;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: none !important;
  box-shadow: 0 1px 0 var(--sv-border), var(--sv-shadow-xs);
  position: relative;
}
.global-header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--sv-brand), #06b6d4, var(--sv-accent), var(--sv-brand));
  background-size: 300% 100%;
  animation: headerShimmer 12s ease infinite;
  opacity: 0.7;
}
@keyframes headerShimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.header-app-title {
  font-size: 17px !important;
  font-weight: 700 !important;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg, var(--sv-brand), #0e7490);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.app-badge-icon {

/* Hide rail, single multilevel sidebar - MES ERP Deep Green #24544b */
.rail { display: none !important; }
.side {
  width: 284px !important;
  background: #24544b !important; /* Exact MES ERP Deep Green */
  color: #ffffff !important;
  border-right: 1px solid #1c443c !important;
  padding: 14px 10px !important;
  box-shadow: 2px 0 10px rgba(0,0,0,0.08);
}
.side .side-head-title {
  color: #ffffff !important;
}
.side .s-search {
  background: rgba(255,255,255,0.12) !important;
  border: 1px solid rgba(255,255,255,0.18) !important;
  border-radius: 8px !important;
  color: rgba(255,255,255,0.7) !important;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  height: 36px;
  margin-bottom: 12px;

  outline: none !important;
  background: none !important;
  flex: 1;
  min-width: 0;
  color: #ffffff !important;
  font-size: 13px;
}
.side .s-search input::placeholder {
  color: rgba(255,255,255,0.6) !important;
}
.side .s-search svg {
  color: rgba(255,255,255,0.65) !important;
}

/* Multilevel sidebar styles */
.side-menu-tree {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 6px;
}
.s-tree-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8.5px 10px;
  border-radius: 8px;
  color: rgba(255,255,255,0.85);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.s-tree-item:hover {
  background: rgba(255,255,255,0.09);
  color: #ffffff;
}
.s-tree-item.active {
  background: rgba(255,255,255,0.18);
  color: #ffffff;
  font-weight: 700;
}
.s-tree-item.open {
  color: #ffffff;
}
.s-tree-item.parent {
  justify-content: space-between;
  background: none !important;
}
.s-tree-item.parent:hover {
  background: rgba(255,255,255,0.08) !important;
}
.s-tree-item.parent.active {
  background: none !important;
  color: #ffffff !important;
}
.s-tree-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.s-tree-badge {
  font-size: 11px;
  font-weight: 700;
  background: rgba(255,255,255,0.18);
  color: #ffffff;
  padding: 1px 7px;
  border-radius: 999px;
  margin-right: 4px;
}
.s-tree-arrow {
  color: rgba(255,255,255,0.65);
  display: inline-flex;
  transition: transform 0.2s ease;
}
.s-tree-arrow.expanded {
  transform: rotate(180deg);
}
.s-tree-children {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-left: 10px;
  margin-left: 10px;
  border-left: 1.5px solid rgba(255,255,255,0.18);
  overflow: hidden;
  transition: max-height 0.25s ease, opacity 0.2s ease;
}
.s-tree-children.collapsed {
  display: none;
}
.s-tree-subitem {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6.5px 10px;
  border-radius: 7px;
  font-size: 12.5px;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.s-tree-subitem:hover {
  background: rgba(255,255,255,0.08);

    ${old ? `<div class="rob" role="status" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;color:#1e40af;padding:10px 24px;font-size:13.5px;display:flex;align-items:center;justify-content:space-between"><span>Đang xem <b>v${old.v}</b> (${verT(old.at)}, ${esc(old.by)}), chỉ đọc.</span><div style="display:flex;gap:8px"><button class="btn btn-outline" id="v_cur">Về bản hiện tại</button><button class="btn green" id="v_rs" style="background:#24544b;color:#fff">Khôi phục bản này</button></div></div>` : ''}

const fold=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').toLowerCase();
function atPick(inp,cb,skip){
  let box=null, items=[], at=0;
  const close=()=>{ if(box){ box.remove(); box=null; } };
  const tok=()=>{ const m=/@([^\s@]*)$/.exec(inp.value.slice(0,inp.selectionStart)); return m?{from:inp.selectionStart-m[0].length,q:m[1]}:null; };
  const draw=()=>{ if(!items.length){ close(); return; }
    if(!box){ box=document.createElement('div'); box.className='atbox'; box.setAttribute('role','listbox'); document.body.append(box);
      box.onmousedown=e=>{ e.preventDefault(); const d=e.target.closest('.ato'); if(d) pick(items[+d.dataset.i]); }; }
    const r=(inp.closest('.chipin')||inp).getBoundingClientRect(); box.style.left=r.left+'px'; box.style.top=r.bottom+4+'px'; box.style.width=r.width+'px';
    box.innerHTML=items.map((u,i)=>`<div class="ato ${i===at?'on':''}" role="option" aria-selected="${i===at}" data-i="${i}">${av(u.name,'sm')}<span><b>${esc(u.name)}</b><em>${esc(u.h)} · ${esc(u.role)}</em></span></div>`).join('');
    const on=box.querySelector('.on'); if(on) on.scrollIntoView({block:'nearest'}); };
  const pick=u=>{ const t=tok(); if(!t) return; const v=inp.value, end=inp.selectionStart; if(cb){ inp.value=v.slice(0,t.from)+v.slice(end); close(); cb(u); return; } inp.value=v.slice(0,t.from)+u.h+' '+v.slice(end); const q=t.from+u.h.length+1; inp.setSelectionRange(q,q); close(); inp.focus(); };
  inp.addEventListener('input',()=>{ const t=tok(); if(!t){ close(); return; } const used=new Set(inp.value.split(/\s+/)); items=USERS.filter(u=>!used.has(u.h)&&!(skip&&skip(u))&&fold(u.h+' '+u.name).includes(fold(t.q))); at=0; draw(); });
  inp.addEventListener('keydown',e=>{ if(!box) return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); at=(at+(e.key==='ArrowDown'?1:items.length-1))%items.length; draw(); }
    else if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); pick(items[at]); }
    else if(e.key==='Escape'){ e.stopPropagation(); close(); } });
  inp.addEventListener('blur',close);
}

  $$('[data-rj]').forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); const r=R.find(x=>x.id===e.dataset.rj); noteM('Từ chối','Lý do từ chối (tối thiểu 10 ký tự)',true,v=>doAct(r,'rj',v,true),10); });
  $('#mk').onclick=openCreateReq; renderRail();
}
/* ===== Tạo nhóm từng bước: 9 mục Studio của Base làm các bước ===== */
const WN=SEC.length;
const wMiss=g=>{ const a=[]; if(!g.name.trim()) a.push('tên nhóm'); if(!g.blocks.length) a.push('ít nhất một người duyệt'); return a.length?'Còn thiếu: '+a.join(', '):''; };
function wOk(g,step){ if(step<2) return ''; if(!g.name.trim()) return 'Nhập tên nhóm đề xuất ở bước 1'; if(!g.blocks.length) return 'Thêm ít nhất một khối người duyệt ở bước 1'; return ''; }
function wizard(id,step){
  const g=gOf(id); if(!g){ $('#main').innerHTML='<div class="empty">Không tìm thấy nhóm</div>'; return; } S.wiz=true; S.wstep=step=Math.min(WN,Math.max(1,step));
  g.vis=g.vis||{}; if(g.last&&g.last!==step) g.vis[g.last]=1; g.last=step;
  const pct=Math.round(step/WN*100), cur=SEC[step-1], nxt=SEC[step];
  $('#main').innerHTML=`<div class="wzh"><div class="wzt"><div><div class="wzk">Tạo nhóm đề xuất</div><h1>${esc(g.name||'Nhóm chưa đặt tên')}</h1></div><div class="wza"><button class="wzl" id="w_del">Hủy tạo nhóm</button><button class="btn" id="w_exit">Lưu nháp và thoát</button></div></div><div class="wzp" role="progressbar" aria-valuemin="1" aria-valuemax="${WN}" aria-valuenow="${step}" aria-label="Tiến độ tạo nhóm"><i style="width:${pct}%"></i></div></div>
   <div class="stu"><nav class="wsn" aria-label="Các bước tạo nhóm">${SEC.map(([k2,l,sub,i],n)=>`<button class="wsi ${n+1===step?'on':''} ${g.vis[n+1]&&n+1!==step?'dn':''}" data-st="${n+1}" ${n+1===step?'aria-current="step"':''}><span class="wsc">${ic(i,20)}</span><span class="wst"><b>${l}${n===0?' <u title="Bắt buộc">*</u>':''}</b><em>${sub}</em></span></button>`).join('')}</nav>
   <div style="flex:1;display:flex;flex-direction:column;min-width:0"><div class="sbody scroll gray"><div class="wsh"><b>${cur[1]}</b><p>${step===1?'':cur[2]+'. Bước này không bắt buộc, bạn có thể bỏ qua và thiết lập sau.'}</p></div><div class="col" id="sc"></div></div>
   <div class="wfoot"><button class="btn" id="w_back" style="visibility:${step>1?'visible':'hidden'}">‹ Quay lại</button><span class="wfn ${wMiss(g)?'bad':''}" id="w_hint" aria-live="polite">${wMiss(g)||(step===WN?'Bước cuối: kiểm tra và kích hoạt nhóm':'Tiếp theo: '+nxt[1])}</span>${step<WN?'<button class="btn" id="w_fin" title="Bỏ qua các bước tùy chọn còn lại">Kích hoạt luôn</button>':''}<button class="btn green" id="w_next">${step===WN?'Kích hoạt nhóm':'Tiếp tục ›'}</button></div></div></div>`;
  const c=$('#sc');
  if(step===1){
    c.innerHTML='<div id="w1b" style="display:flex;flex-direction:column;gap:14px"></div>';
    sGeneral(g,$('#w1b'));
    const info=$('#w1b').children[0];
    info.innerHTML=`${cardH('doc','Thông tin chung','Đặt tên và các thiết lập cơ bản của nhóm. Chỉ tên nhóm là bắt buộc.')}
     <div class="wfg">
      <label class="wf full"><span>Tên nhóm đề xuất <em>*</em></span><input class="inp" id="w_n" placeholder="Ví dụ: NS_ĐX01 (Xin nghỉ phép)" value="${esc(g.name)}"></label>
      <label class="wf full"><span>Nhóm</span><select class="sel" id="w_f">${[...new Set(G.map(x=>x.folder))].sort().map(f=>`<option ${g.folder===f?'selected':''}>${esc(f)}</option>`).join('')}</select><small>Thư mục chứa nhóm đề xuất, hiện ở cột "Nhóm" trong danh sách.</small></label>
      <div class="wf full" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--sv-surface-warm,#fafbfc);border:1px solid var(--sv-border,#e8ebed);border-radius:10px;margin-top:6px">
        <div>
          <b style="font-size:13.5px;display:block">Kích hoạt nhóm sau khi tạo</b>
          <span style="font-size:12px;color:var(--sv-text-muted,#8b9097)">Cho phép nhân viên gửi đề xuất vào nhóm này ngay lập tức</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <label class="switch-toggle"><input type="checkbox" id="w_act" ${g.active?'checked':''}><span class="slider round"></span></label>
          <span id="w_act_txt" style="font-size:12.5px;font-weight:600;color:${g.active?'var(--sv-success,#059669)':'var(--sv-text-muted,#8b9097)'}">${g.active?'Đang khả dụng':'Đang tạm đóng'}</span>
        </div>
      </div>
      <details class="wmore full" ${(g.cat||g.sla||g.allowSla||g.desc||g.scope!=='Toàn công ty')?'open':''}><summary>Thiết lập thêm <em>Phân loại, SLA, phạm vi sử dụng, mô tả. Không bắt buộc</em></summary><div class="wfg wfg2">
      <label class="wf"><span>Phân loại</span><input class="inp" id="w_c" value="${esc(g.cat)}" placeholder="Ví dụ: Phòng KD, Human Resource"></label>
      <label class="wf"><span>SLA (giờ)</span><input class="inp" id="w_s" type="number" min="0" value="${g.sla||''}" placeholder="Để trống nếu không yêu cầu"><small>Số giờ tối đa để xử lý một đề xuất.</small></label>
      <label class="wf"><span>Cho phép chỉnh SLA</span><select class="sel" id="w_as"><option value="0" ${g.allowSla?'':'selected'}>Không</option><option value="1" ${g.allowSla?'selected':''}>Có</option></select><small>Người gửi có được tự đổi SLA hay không.</small></label>
      <label class="wf"><span>Sử dụng cho</span><input class="inp" id="w_u" value="${g.scope==='Toàn công ty'?'':esc(g.scope)}" placeholder="Để trống nếu cho cả công ty"><small>Nhóm hoặc bộ phận được tạo đề xuất này.</small></label>
      <label class="wf full"><span>Mô tả nhóm đề xuất</span><textarea class="inp" id="w_m" rows="3" placeholder="Mô tả ngắn để nhân viên chọn đúng nhóm">${esc(g.desc)}</textarea></label></div></details>
      <div class="wby full">Tạo bởi ${av(g.by,'xs')} <b>${esc(g.by)}</b></div></div>`;
    if(!g.name) $('#w_n').focus();
    $('#w_n').oninput=e=>{ g.name=e.target.value; e.target.classList.remove('err'); $('.wzh h1').textContent=g.name||'Nhóm chưa đặt tên'; const m=wMiss(g), h=$('#w_hint'); h.textContent=m||'Tiếp theo: '+nxt[1]; h.classList.toggle('bad',!!m); }; $('#w_f').onchange=e=>{ g.folder=e.target.value; }; $('#w_c').oninput=e=>{ g.cat=e.target.value; }; $('#w_s').oninput=e=>{ g.sla=+e.target.value||0; };
    $('#w_as').onchange=e=>{ g.allowSla=e.target.value==='1'; }; $('#w_u').oninput=e=>{ g.scope=e.target.value.trim()||'Toàn công ty'; }; $('#w_m').oninput=e=>{ g.desc=e.target.value; };
  } else ({form:sForm,tags:sTags,print:sPrint,hook:sHook,perm:sPerm,sign:sSign,count:sCount,noti:sNoti})[SEC[step-1][0]](g,c); $$('#sc>.card').forEach(k=>{ const h=k.querySelector('.ch'); if(!h) return; const b=document.createElement('div'); b.className='cb'; [...k.children].filter(x=>x!==h).forEach(x=>b.appendChild(x)); k.append(b); k.classList.add('two'); }); if($$('#sc>.card.two').length===1) $('#sc>.card.two').classList.add('solo');
  $$('[data-st]').forEach(e=>e.onclick=()=>{ const t=+e.dataset.st, m=t>step?wOk(g,t):''; if(m) toast(m); else go(`#/groups/new/${id}?step=${t}`); });
  $('#w_back').onclick=()=>go(`#/groups/new/${id}?step=${step-1}`);
  $('#w_del').onclick=e=>{ if(e.target.dataset.sure){ G.splice(G.indexOf(g),1); go('#/groups'); toast('Đã xóa bản nháp'); } else { e.target.dataset.sure=1; e.target.textContent='Bấm lần nữa để xóa'; } };
  $('#w_exit').onclick=()=>{ go('#/groups'); toast('Đã lưu bản nháp'); };
  const lack=()=>{ if(!wMiss(g)) return false; if(step!==1){ toast(wMiss(g)); go(`#/groups/new/${id}?step=1`); return true; }
    if(!g.name.trim()){ const n=$('#w_n'); n.classList.add('err'); n.focus(); } else { const k=$$('#sc>.card').find(x=>/Người duyệt/.test(x.querySelector('h3').textContent)); k&&k.scrollIntoView({block:'center',behavior:'smooth'}); }
    toast(wMiss(g)); return true; };
  const done=()=>{ g.active=true; g.draft=false; bumpVer(g); go('#/groups'); toast('Đã kích hoạt nhóm "'+g.name+'"'); };
  $('#w_next').onclick=()=>{ if(lack()) return; if(step<WN) go(`#/groups/new/${id}?step=${step+1}`); else done(); };
  const fin=$('#w_fin'); if(fin) fin.onclick=()=>{ if(!lack()) done(); };
}
